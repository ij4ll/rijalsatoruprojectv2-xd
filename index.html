<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RijalSatoru-Api - REST API & Code Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Permanent+Marker&family=Plus+Jakarta+Sans:wght@400;600;800;900&family=Fira+Code:wght@400;600&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; }
    .graffiti-3d {
      font-family: 'Permanent Marker', cursive;
      color: #00f3ff;
      -webkit-text-stroke: 1.8px #000;
      text-shadow: 3px 3px 0px #000, 0 0 15px rgba(0, 243, 255, 0.8);
    }
    .scrollbar-hide::-webkit-scrollbar { display: none; }
    .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    @keyframes fadeInUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    .animate-fade-up { animation: fadeInUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
  </style>
</head>
<body class="text-slate-200 min-h-screen flex flex-col justify-between overflow-x-hidden relative">

  <!-- BACKGROUND VIDEO (Tanpa Blur) -->
  <div class="fixed inset-0 z-[-10] overflow-hidden pointer-events-none">
    <video autoplay muted loop playsinline class="w-full h-full object-cover">
      <source src="https://files.catbox.moe/kznynd.mp4" type="video/mp4">
    </video>
    <div class="absolute inset-0 bg-slate-950/75"></div>
  </div>

  <!-- NAVBAR -->
  <nav class="border-b border-purple-500/30 bg-slate-950/85 backdrop-blur-md sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 py-3.5 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <button onclick="toggleSidebar()" class="text-cyan-400 text-2xl p-1.5 rounded-xl hover:bg-slate-900 transition focus:outline-none">
          <i class="fa-solid fa-bars"></i>
        </button>
        <div class="flex items-center gap-2">
          <h1 class="graffiti-3d text-xl md:text-2xl tracking-wide">RijalSatoru-Api</h1>
          <span class="text-[10px] bg-cyan-500/20 text-cyan-400 border border-cyan-500/40 px-2 py-0.5 rounded-full font-bold">1.1.0</span>
        </div>
      </div>
      <div class="flex items-center gap-3">
        <button onclick="copyUserKeyIcon()" class="p-2.5 rounded-xl bg-slate-900 border border-cyan-500/30 text-cyan-400 hover:bg-slate-800 transition" title="API Key Anda"><i class="fa-solid fa-key"></i></button>
      </div>
    </div>
  </nav>

  <div id="sidebarOverlay" onclick="toggleSidebar()" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm hidden z-50 transition-opacity"></div>

  <!-- SIDEBAR -->
  <aside id="sidebar" class="fixed top-0 left-0 h-full w-64 bg-slate-950/95 border-r border-purple-500/40 p-5 z-50 transform -translate-x-full transition-transform duration-300 ease-in-out flex flex-col justify-between shadow-2xl backdrop-blur-xl">
    <div>
      <div class="flex justify-between items-center mb-6 border-b border-slate-800 pb-3">
        <h2 class="graffiti-3d text-lg">NAVIGASI</h2>
        <button onclick="toggleSidebar()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <ul class="space-y-2 font-bold text-xs text-slate-300">
        <li id="menuLogin"><a href="/login.html" class="block px-3 py-3 rounded-xl hover:bg-slate-900 hover:text-cyan-400 flex items-center gap-3 transition"><i class="fa-solid fa-right-to-bracket text-emerald-400 w-5"></i> Login</a></li>
        <li id="menuRegister"><a href="/register.html" class="block px-3 py-3 rounded-xl hover:bg-slate-900 hover:text-cyan-400 flex items-center gap-3 transition"><i class="fa-solid fa-user-plus text-purple-400 w-5"></i> Registrasi</a></li>
        <li id="menuLogout" class="hidden"><button onclick="handleLogout()" class="w-full text-left px-3 py-3 rounded-xl hover:bg-red-500/20 hover:text-red-400 flex items-center gap-3 transition text-red-400"><i class="fa-solid fa-right-from-bracket w-5"></i> Logout</button></li>
      </ul>
    </div>
    <div class="text-[10px] text-slate-500 text-center border-t border-slate-800 pt-3">RijalSatoru-Api &copy; 2026</div>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="max-w-5xl mx-auto px-4 py-6 w-full animate-fade-up">
    <!-- INFO STATS -->
    <div class="mb-4 text-xs font-semibold text-slate-400">
      <span id="totalCatCount">24 kategori</span> • <span id="totalEndpointCount">706 endpoint</span> • halaman <span id="currentPageLabel">1</span>/<span id="totalPagesLabel">48</span>
    </div>

    <!-- SEARCH BAR -->
    <div class="relative mb-6">
      <input type="text" id="searchInput" oninput="handleSearch()" placeholder="Cari kategori, contoh: anime, game, tools." class="w-full bg-slate-950/90 border border-purple-500/40 rounded-2xl py-3 pl-10 pr-4 text-xs text-white focus:outline-none focus:border-cyan-400 shadow-lg">
      <i class="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-xs text-slate-400"></i>
    </div>

    <!-- KATEGORI TAGS BUTTONS (24 Kategori) -->
    <div class="flex flex-wrap gap-2 mb-8" id="categoryTagsContainer">
      <button onclick="filterCategory('all')" class="cat-tag px-3 py-1.5 bg-cyan-400 text-slate-950 font-black text-xs rounded-xl transition shadow">All</button>
    </div>

    <!-- CONTAINER DAFTAR KATEGORI & ENDPOINT -->
    <div id="categorySectionsContainer" class="space-y-6 mb-12"></div>

    <!-- PAGINATION CONTROLS -->
    <div class="flex flex-wrap items-center justify-center gap-2 mb-12" id="paginationContainer"></div>
  </main>

  <!-- MODAL POP UP BELUM LOGIN -->
  <div id="loginModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md hidden z-50 flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-cyan-500/40 p-6 rounded-3xl max-w-sm w-full text-center shadow-2xl animate-fade-up">
      <div class="w-14 h-14 bg-cyan-500/20 text-cyan-400 rounded-2xl flex items-center justify-center mx-auto mb-4 text-2xl">
        <i class="fa-solid fa-lock"></i>
      </div>
      <h3 class="text-lg font-black text-white mb-2">Akses Ditolak!</h3>
      <p class="text-xs text-slate-400 mb-6">Kamu harus Login atau Register terlebih dahulu untuk menguji atau mengambil endpoint di RijalSatoru-Api.</p>
      <div class="flex gap-2">
        <a href="/login.html" class="flex-1 py-2.5 bg-cyan-400 text-slate-950 font-black text-xs rounded-xl hover:bg-cyan-300 transition text-center">Login</a>
        <a href="/register.html" class="flex-1 py-2.5 bg-purple-600 text-white font-black text-xs rounded-xl hover:bg-purple-500 transition text-center">Register</a>
      </div>
      <button onclick="closeLoginModal()" class="mt-4 text-[11px] text-slate-500 hover:text-slate-300 font-bold">Tutup</button>
    </div>
  </div>

  <script src="/common.js"></script>
  <script>
    let currentUser = null;
    let currentCategory = 'all';
    let endpointsData = [];
    let currentPage = 1;
    const itemsPerPage = 15; // Jumlah endpoint per halaman kategori

    const categoriesList = [
      'anime', 'asupan', 'cecan', 'emoji', 'game', 'islamic', 'news', 'nsfw', 
      'primbon', 'random', 'search', 'sound', 'stalk', 'story', 'tools', 
      'vokal', 'wallpaper', 'webzone', 'maker', 'textpro', 'photooxy', 'ephoto', 'sticker', 'download'
    ];

    function generateEndpoints() {
      let res = [];
      const sampleNames = {
        anime: ['akira', 'akiyama', 'ana', 'asuna', 'ayuzawa', 'boruto', 'chiho', 'chitoge', 'deidara', 'erza', 'goku', 'hinata', 'itachi', 'kakashi', 'levi', 'madara', 'naruto', 'nezuko', 'onepiece', 'sasuke'],
        asupan: ['tiktok-1', 'tiktok-2', 'vios', 'bocil', 'selebgram', 'hijab', 'sunda', 'jawa', 'goyang', 'random-1'],
        cecan: ['indonesia', 'malaysia', 'thailand', 'vietnam', 'korea', 'japan', 'china', 'hijab', 'santuy', 'geulis'],
        emoji: ['mix-1', 'mix-2', 'combo-3', 'animate', 'custom'],
        game: ['ml-stalk', 'ff-stalk', 'pubg-stalk', 'genshin-check', 'valorant', 'hok-stats'],
        islamic: ['quran-surah', 'tahlil', 'asmaulhusna', 'jadwal-sholat', 'kisah-nabi', 'doa-harian'],
        news: ['detik', 'kompas', 'cnn', 'antara', 'tribun', 'cnbc'],
        nsfw: ['waifu', 'neko', 'trap', 'blowjob', 'hentai', 'milf'],
        primbon: ['weton', 'artinama', 'zodiak', 'shio', 'tarot', 'jodoh'],
        random: ['qc', 'quote', 'fakta-unik', 'pantun', 'gombalan', 'katabijak'],
        search: ['google', 'pinterest', 'happymod', 'youtube', 'spotify', 'playstore'],
        sound: ['sound-1', 'sound-2', 'meme-1', 'anime-sfx', 'dj-remix'],
        stalk: ['igstalk', 'githubstalk', 'tiktokstalk', 'twitterstalk', 'npmstalk'],
        story: ['igstory', 'tiktokstory', 'fbstory', 'wa-status'],
        tools: ['ssweb', 'tourl', 'shorturl', 'base64', 'qrcode', 'translate'],
        vokal: ['bassboost', 'nightcore', 'chipmunk', 'blownout', 'reverse'],
        wallpaper: ['mobile-legends', 'genshin', 'aesthetic', 'cyberpunk', 'nature', 'anime'],
        webzone: ['check-ip', 'dns-lookup', 'whois', 'ping', 'port-scanner'],
        maker: ['nulis', 'brat', 'ttp', 'attp', 'quotly', 'carbon'],
        textpro: ['neon', 'glitch', 'thunder', 'blackpink', 'harrypotter', 'joker'],
        photooxy: ['shadow', 'cup', 'romantic', 'wood', 'burn', 'smoky'],
        ephoto: ['3d-text', 'galaxy', 'smoke', 'fire', 'water', 'gold'],
        sticker: ['telegram', 'gura', 'wawa', 'meme-pack', 'animal', 'anime-pack'],
        download: ['ytmp4', 'ytmp3', 'capcut', 'mediafire', 'instagram', 'facebook']
      };

      categoriesList.forEach(cat => {
        const names = sampleNames[cat] || ['api-1', 'api-2', 'api-3'];
        for(let i=1; i<=30; i++) {
          const baseName = names[(i - 1) % names.length];
          const suffix = i > names.length ? `-${i}` : '';
          res.push({ cat: cat, path: `/api/${cat}/${baseName}${suffix}` });
        }
      });
      return res;
    }

    function refreshAuthUI() {
      const stored = localStorage.getItem('user_data');
      if (stored) {
        try { currentUser = JSON.parse(stored); } catch (e) { currentUser = null; }
      } else {
        currentUser = null;
      }
      document.getElementById('menuLogout').classList.toggle('hidden', !currentUser);
      document.getElementById('menuLogin').classList.toggle('hidden', !!currentUser);
      document.getElementById('menuRegister').classList.toggle('hidden', !!currentUser);
    }

    window.onload = function() {
      endpointsData = generateEndpoints();
      document.getElementById('totalEndpointCount').innerText = `${endpointsData.length} endpoint`;
      document.getElementById('totalCatCount').innerText = `${categoriesList.length} kategori`;

      const tagContainer = document.getElementById('categoryTagsContainer');
      categoriesList.forEach(cat => {
        tagContainer.innerHTML += `
          <button onclick="filterCategory('${cat}')" class="cat-tag px-3 py-1.5 bg-slate-900/80 border border-purple-500/30 text-slate-300 font-bold text-xs rounded-xl hover:bg-slate-800 transition">#${cat}</button>
        `;
      });

      refreshAuthUI();
      handleSearch();
    };

    function filterCategory(cat) {
      currentCategory = cat;
      currentPage = 1;

      document.querySelectorAll('.cat-tag').forEach(btn => {
        if(btn.innerText.toLowerCase().includes(cat === 'all' ? 'all' : `#${cat}`)) {
          btn.className = "cat-tag px-3 py-1.5 bg-cyan-400 text-slate-950 font-black text-xs rounded-xl transition shadow";
        } else {
          btn.className = "cat-tag px-3 py-1.5 bg-slate-900/80 border border-purple-500/30 text-slate-300 font-bold text-xs rounded-xl hover:bg-slate-800 transition";
        }
      });

      handleSearch();
    }

    function handleSearch() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      let filtered = endpointsData;

      if (currentCategory !== 'all') {
        filtered = filtered.filter(e => e.cat === currentCategory);
      }
      if (q) {
        filtered = filtered.filter(e => e.cat.toLowerCase().includes(q) || e.path.toLowerCase().includes(q));
      }

      renderGroupedEndpoints(filtered);
    }

    function renderGroupedEndpoints(data) {
      const container = document.getElementById('categorySectionsContainer');
      container.innerHTML = '';

      const grouped = {};
      data.forEach(e => {
        if (!grouped[e.cat]) grouped[e.cat] = [];
        grouped[e.cat].push(e);
      });

      const catKeys = Object.keys(grouped);
      const totalPages = Math.ceil(data.length / itemsPerPage) || 1;
      if (currentPage > totalPages) currentPage = 1;

      document.getElementById('currentPageLabel').innerText = currentPage;
      document.getElementById('totalPagesLabel').innerText = totalPages;

      if (catKeys.length === 0) {
        container.innerHTML = `<div class="text-center py-12 text-slate-400 text-xs">Endpoint tidak ditemukan.</div>`;
        renderPagination(0);
        return;
      }

      let allItemsFlattened = [];
      catKeys.forEach(cat => {
        grouped[cat].forEach(item => allItemsFlattened.push(item));
      });

      const start = (currentPage - 1) * itemsPerPage;
      const paginatedItems = allItemsFlattened.slice(start, start + itemsPerPage);

      const paginatedGrouped = {};
      paginatedItems.forEach(e => {
        if (!paginatedGrouped[e.cat]) paginatedGrouped[e.cat] = [];
        paginatedGrouped[e.cat].push(e);
      });

      Object.keys(paginatedGrouped).forEach(cat => {
        const items = paginatedGrouped[cat];
        let itemsHtml = '';

        items.forEach((e, idx) => {
          const uniqueId = `${cat}_${idx}_${Math.random().toString(36).substring(2,6)}`;
          itemsHtml += `
            <div class="bg-slate-900/60 border border-slate-800 rounded-xl p-3 mb-2 transition hover:border-cyan-500/40">
              <div class="flex items-center justify-between cursor-pointer" onclick="toggleAccordion('${uniqueId}')">
                <div class="flex items-center gap-2.5 overflow-hidden">
                  <span class="bg-emerald-500/20 text-emerald-400 border border-emerald-500/40 text-[10px] font-black px-2 py-0.5 rounded">GET</span>
                  <code class="text-xs font-mono text-pink-300 font-bold truncate">${e.path}</code>
                </div>
                <div class="flex items-center gap-3 text-slate-400">
                  <button onclick="event.stopPropagation(); copyPathQuick('${e.path}')" class="hover:text-cyan-400 transition" title="Copy Path"><i class="fa-solid fa-link text-xs"></i></button>
                  <i id="icon_${uniqueId}" class="fa-solid fa-chevron-down text-xs transition-transform"></i>
                </div>
              </div>

              <div id="acc_${uniqueId}" class="hidden mt-3 pt-3 border-t border-slate-800/80 animate-fade-up">
                <div class="flex items-center justify-between mb-2">
                  <span class="text-[10px] font-bold text-slate-400 uppercase">Pilih Bahasa Code:</span>
                  <select id="lang_${uniqueId}" onchange="updateSnippet('${e.path}', '${uniqueId}')" class="bg-slate-950 border border-purple-500/30 text-[10px] text-cyan-300 font-bold rounded px-2 py-1 focus:outline-none">
                    <option value="curl">cURL</option>
                    <option value="js">JavaScript</option>
                    <option value="python">Python</option>
                  </select>
                </div>
                <div class="relative bg-slate-950 p-2.5 rounded-lg border border-slate-800 mb-3">
                  <code id="code_${uniqueId}" class="block text-[10px] font-mono text-cyan-300 overflow-x-auto whitespace-nowrap">curl -X GET "${API_BASE_DOMAIN}${e.path}?apikey=YOUR_APIKEY"</code>
                </div>
                <div class="flex gap-2">
                  <button onclick="copySnippetCode('${uniqueId}')" class="flex-1 py-1.5 bg-slate-800 text-slate-200 font-bold text-[11px] rounded-lg hover:bg-slate-700 transition">Copy Code</button>
                  <button onclick="testEndpoint('${e.path}')" class="flex-1 py-1.5 bg-cyan-400 text-slate-950 font-black text-[11px] rounded-lg hover:bg-cyan-300 transition">Test Live</button>
                </div>
              </div>
            </div>
          `;
        });

        container.innerHTML += `
          <div class="bg-slate-950/85 border border-purple-500/30 backdrop-blur-xl p-5 rounded-3xl shadow-xl">
            <div class="flex items-center justify-between mb-4 pb-2 border-b border-slate-800">
              <h3 class="font-black text-white text-sm uppercase tracking-wider flex items-center gap-2">
                <i class="fa-solid fa-folder-open text-cyan-400"></i> ${cat}
              </h3>
              <span class="text-[10px] font-bold bg-slate-900 border border-slate-800 px-2.5 py-1 rounded-full text-slate-400">${grouped[cat].length} endpoint</span>
            </div>
            <div>${itemsHtml}</div>
          </div>
        `;
      });

      renderPagination(allItemsFlattened.length);
    }

    function toggleAccordion(id) {
      const acc = document.getElementById(`acc_${id}`);
      const icon = document.getElementById(`icon_${id}`);
      acc.classList.toggle('hidden');
      icon.classList.toggle('rotate-180');
    }

    function updateSnippet(path, uniqueId) {
      const mode = document.getElementById(`lang_${uniqueId}`).value;
      const codeEl = document.getElementById(`code_${uniqueId}`);
      const apiKeyVal = currentUser ? currentUser.apikey : 'YOUR_APIKEY';
      const fullUrl = `${API_BASE_DOMAIN}${path}?apikey=${apiKeyVal}`;

      if (mode === 'curl') {
        codeEl.innerText = `curl -X GET "${fullUrl}"`;
      } else if (mode === 'js') {
        codeEl.innerText = `fetch("${fullUrl}").then(res => res.json()).then(console.log);`;
      } else if (mode === 'python') {
        codeEl.innerText = `import requests\nres = requests.get("${fullUrl}").json()\nprint(res)`;
      }
    }

    function copyPathQuick(path) {
      if (!currentUser) { showLoginModal(); return; }
      const fullUrl = `${API_BASE_DOMAIN}${path}?apikey=${currentUser.apikey}`;
      navigator.clipboard.writeText(fullUrl);
      showNotify('success', 'Berhasil Disalin', 'URL endpoint sudah disalin ke clipboard.');
    }

    function copySnippetCode(uniqueId) {
      if (!currentUser) { showLoginModal(); return; }
      const text = document.getElementById(`code_${uniqueId}`).innerText;
      navigator.clipboard.writeText(text);
      showNotify('success', 'Berhasil Disalin', 'Cuplikan kode sudah disalin ke clipboard.');
    }

    function renderPagination(totalItems) {
      const paginationEl = document.getElementById('paginationContainer');
      paginationEl.innerHTML = '';
      const totalPages = Math.ceil(totalItems / itemsPerPage);
      if (totalPages <= 1) return;

      paginationEl.innerHTML += `
        <button onclick="changePage(${currentPage - 1})" ${currentPage === 1 ? 'disabled class="px-3 py-1.5 bg-slate-900 text-slate-600 font-bold text-xs rounded-lg cursor-not-allowed"' : 'class="px-3 py-1.5 bg-slate-900 border border-purple-500/30 text-white font-bold text-xs rounded-lg hover:bg-slate-800 transition"'}>
          &laquo; Prev
        </button>
      `;

      for (let i = 1; i <= totalPages; i++) {
        if (i === 1 || i === totalPages || (i >= currentPage - 2 && i <= currentPage + 2)) {
          const isActive = i === currentPage;
          paginationEl.innerHTML += `
            <button onclick="changePage(${i})" class="px-3.5 py-1.5 font-black text-xs rounded-lg transition ${isActive ? 'bg-cyan-400 text-slate-950 shadow-lg' : 'bg-slate-900/90 border border-purple-500/30 text-slate-300 hover:bg-slate-800'}">
              ${i}
            </button>
          `;
        } else if (i === currentPage - 3 || i === currentPage + 3) {
          paginationEl.innerHTML += `<span class="text-slate-500 px-1 text-xs">...</span>`;
        }
      }

      paginationEl.innerHTML += `
        <button onclick="changePage(${currentPage + 1})" ${currentPage === totalPages ? 'disabled class="px-3 py-1.5 bg-slate-900 text-slate-600 font-bold text-xs rounded-lg cursor-not-allowed"' : 'class="px-3 py-1.5 bg-slate-900 border border-purple-500/30 text-white font-bold text-xs rounded-lg hover:bg-slate-800 transition"'}>
          Next &raquo;
        </button>
      `;
    }

    function changePage(page) {
      const totalPages = Math.ceil(endpointsData.length / itemsPerPage);
      if (page < 1 || page > totalPages) return;
      currentPage = page;
      handleSearch();
      window.scrollTo({ top: 150, behavior: 'smooth' });
    }

    function testEndpoint(path) {
      if (!currentUser) { showLoginModal(); return; }
      window.open(`${API_BASE_DOMAIN}${path}?apikey=${currentUser.apikey}`, '_blank');
    }

    function copyUserKeyIcon() {
      if (!currentUser) { showLoginModal(); return; }
      navigator.clipboard.writeText(currentUser.apikey);
      showNotify('success', 'API Key Disalin', 'API Key Anda: ' + currentUser.apikey);
    }

    function showLoginModal() { document.getElementById('loginModal').classList.remove('hidden'); }
    function closeLoginModal() { document.getElementById('loginModal').classList.add('hidden'); }
    function handleLogout() {
      localStorage.removeItem('user_data');
      refreshAuthUI();
      showNotify('info', 'Logout Berhasil', 'Anda telah keluar dari akun.');
    }
    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('-translate-x-full');
      document.getElementById('sidebarOverlay').classList.toggle('hidden');
    }
  </script>
</body>
</html>
